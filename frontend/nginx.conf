server {
    listen 80;
    server_name localhost;

    # Maximum file upload size (currency images)
    client_max_body_size 25M;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Embedded Docker DNS resolver for dynamic service discovery without startup block
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:8000";

    # Static assets produced by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy backend health check
    location /health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy FastAPI OpenAPI documentation
    location /docs {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Reverse proxy uploaded images and Grad-CAM visualizations
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /results/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }
}
